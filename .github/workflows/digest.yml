name: Daily digest

# Phase-0 lifeline on a schedule: scrape -> normalize -> dedupe -> match ->
# digest email + Telegram deadline alerts, then the housekeeping sweep.
#
# 07:30 Asia/Amman. Jordan is permanently UTC+3 (no DST since 2022), so that is
# 04:30 UTC. workflow_dispatch lets you trigger the first real run by hand.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    env:
      # --- Cloudflare D1 + R2 ---
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      # --- LLM (analyzer + extraction fallback) ---
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # --- Delivery ---
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
      TZ: Asia/Amman
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt
      # Full runtime: embeddings (better matching) + analyzer. Heavy (torch);
      # for scale, move the worker to a container host (see DEPLOYMENT.md).
      - run: pip install -r requirements.txt
      - name: Digest (scrape → match → email)
        run: python -m pipeline.run digest
      - name: Deadline alerts (Telegram)
        run: python -m pipeline.run deadlines
      - name: Housekeeping sweep (close tenders, expire subscriptions)
        run: python -m pipeline.run sweep
