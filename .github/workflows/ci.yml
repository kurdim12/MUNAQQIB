name: CI

# Lint + typecheck + test + build on every push and PR. No secrets needed:
# the web app degrades to the dev seam without AUTH_SECRET/D1, and the worker
# tests run fully offline (stubbed LLM/D1, parsers against committed fixtures).
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  web:
    name: web (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npx vitest run
      - run: npx next build

  worker:
    name: worker (apps/worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/requirements-dev.txt
      # Slim set (no torch/OCR) — the suite runs keyword-only + stubbed LLM.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
