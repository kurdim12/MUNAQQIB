  مياه ومجاري:
    grades: [1, 2, 3, 4, 5, 6]
    lexicon: [مياه, مجاري, صرف صحي, خط ناقل, شبكة مياه, خزان, محطة ضخ, تنقية, تحلية, انابيب, آبار, حفر بئر]
  كهرباء:
