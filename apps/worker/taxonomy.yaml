# Classification taxonomy — the matching backbone (CLAUDE.md §8).
#
# contractor_fields: GTD contractor-classification fields, each with a keyword
#   lexicon used by the matcher's keyword pass (compared after norm_ar()).
# supply_categories: JordanBids-style supply category slugs + lexicons.
#
# Lexicons are seeds, not final. The design partner's dismissed/saved feedback
# (matches.dismissed/saved) is the free training signal used to tune them.

contractor_fields:
  أبنية:
    grades: [1, 2, 3, 4, 5, 6]
    lexicon: [انشاء, إنشاء, بناء, تشطيب, مدرسة, مبنى, مباني, هنجر, ترميم, صيانة مباني, اعمال مدنية, مستودع, قاعة, مسجد, عيادة, اعمار]
  طرق:
