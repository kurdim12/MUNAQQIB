  ميكانيك:
    grades: [1, 2, 3, 4, 5, 6]
    lexicon: [ميكانيك, ميكانيكية, تكييف, تدفئة, تهوية, مصاعد, مضخات, اطفاء حريق, انظمة ميكانيكية]
  صيانة:
